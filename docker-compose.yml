# Myolotrain 部署编排：app + postgres 两个容器，对外只开放一个端口（API 与控制台共用）。
#
# 推荐用启动脚本，它会在宿主机端口被占用时自动顺延（8000 → 8001 → ……），并自动判断是否启用 GPU：
#   Linux:   scripts/start.sh
#   Windows: powershell -ExecutionPolicy Bypass -File scripts/start.ps1
# 也可以手动：APP_PORT=8000 docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# 首次部署前：cp .env.example .env，并至少填写 SECRET_KEY、POSTGRES_PASSWORD。
name: myolotrain

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yolov8_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不映射端口：数据库只在 compose 内部网络可达
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
    image: myolotrain:latest
    env_file: .env
    environment:
      # 以下几项与容器内的布局绑定，不受 .env 影响
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      SERVER_PORT: "8000"
      DATA_DIR: /data
    ports:
      # 唯一对外端口。宿主机端口由启动脚本选定（冲突时顺延），容器内固定 8000
      - "${APP_PORT:-8000}:8000"
    volumes:
      - appdata:/data
    # DataLoader 多进程依赖共享内存，Docker 默认的 64MB 会让训练报 "bus error"
    shm_size: 8gb
    # 给训练进程留时间在收到停止信号后保存 last.pt
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
