<!-- 文件浏览器模态框 -->
<div class="modal fade" id="file-browser-modal" tabindex="-1" aria-labelledby="file-browser-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="file-browser-modal-label">选择目录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb" id="file-browser-breadcrumb">
                        <li class="breadcrumb-item active" aria-current="page">根目录</li>
                    </ol>
                </nav>
                <div class="list-group" id="file-browser-items">
                    <div class="d-flex justify-content-center py-3">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="select-directory-btn">选择当前目录</button>
            </div>
        </div>
    </div>
</div>
