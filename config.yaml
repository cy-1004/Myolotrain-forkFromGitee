# YOLOv8配置

# 训练配置
train:
  # 数据集路径
  dataset_path: './dataset'
  # 训练结果保存路径
  output_path: './runs/train'
  # 预训练权重路径，为空则从头开始训练，或指定'yolov8n.pt'等预训练模型
  weights: ''
  # 批次大小
  batch_size: 16
  # 输入图像大小
  img_size: 640
  # 训练轮数
  epochs: 100
  # 初始学习率
  lr0: 0.01
  # 最终学习率
  lrf: 0.01
  # 权重衰减
  weight_decay: 0.0005
  # 预热轮数
  warmup_epochs: 3
  # 预热动量
  warmup_momentum: 0.8
  # 训练动量
  momentum: 0.937

# 模型配置
model:
  # 模型类型: 'yolov8n', 'yolov8s', 'yolov8m', 'yolov8l', 'yolov8x'
  type: 'yolov8n'
  # 类别数量
  nc: 80
  # 任务类型: 'detect', 'segment', 'classify', 'pose'
  task: 'detect'

# 数据增强配置
augmentation:
  # 是否使用马赛克增强
  mosaic: 1.0
  # 是否使用混合样本增强
  mixup: 0.0
  # 是否使用复制粘贴增强
  copy_paste: 0.0
  # 是否使用随机透视变换
  perspective: 0.0
  # 是否使用HSV颜色空间增强
  hsv_h: 0.015  # 色调增强
  hsv_s: 0.7    # 饱和度增强
  hsv_v: 0.4    # 亮度增强
  # 是否使用随机水平翻转
  fliplr: 0.5
  # 是否使用随机垂直翻转
  flipud: 0.0
  # 旋转增强
  degrees: 0.0
  # 平移增强
  translate: 0.1
  # 缩放增强
  scale: 0.5
  # 剪切增强
  shear: 0.0
